name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing (and provenance)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and test
        run: npm run check

      - name: Build
        run: npm run build

      # Checks and build already ran; don't repeat the publish lifecycle hooks.
      # No NODE_AUTH_TOKEN: npm authenticates via OIDC as the trusted publisher.
      - run: npm publish --access public --ignore-scripts
